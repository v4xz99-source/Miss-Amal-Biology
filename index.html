const mapV=r=>({id:r.id,title:r.title,kind:r.kind,url:r.url,fileKey:r.file_path,mime:r.mime,fname:r.fname,size:r.size,grade:r.grade,group:r.grp,created:r.created_at?new Date(r.created_at).getTime():0});
const mapP=r=>({sec:r.sec||0,done:!!r.done,manual:!!r.manual,first:r.first_at?new Date(r.first_at).getTime():0,last:r.last_at?new Date(r.last_at).getTime():0});
async function fetchAll(build){let out=[],from=0;for(;;){const {data,error}=await build().range(from,from+999);if(error||!data)break;out=out.concat(data);if(data.length<1000)break;from+=1000}return out}
function normPhone(v){
  let t=String(v||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[\s\-()]/g,'');
  if(t.startsWith('+20'))t='0'+t.slice(3);else if(t.startsWith('0020'))t='0'+t.slice(4);else if(/^20\d{10}$/.test(t))t='0'+t.slice(2);
  return t}
const okPhone=t=>/^01[0125]\d{8}$/.test(t);
function errMsg(e){const m=(e&&e.message)||String(e);
  if(/rate limit|too many|429/i.test(m))return 'تم تجاوز حد إرسال الإيميلات في Supabase. اقفل Confirm email (Authentication ← Sign In / Providers ← Email) وحاول تاني';
  if(/not confirmed/i.test(m))return 'الحساب لسه مش مفعّل: اقفل Confirm email من إعدادات Supabase';
  if(/duplicate|23505|already/i.test(m))return 'الاسم ده مستخدم قبل كده';
  if(/Invalid login/i.test(m))return 'الاسم أو الباسورد غلط';
  if(/Failed to fetch|network/i.test(m))return 'مشكلة في الاتصال بالإنترنت';
  return m}

async function emailFor(name){
  const norm=name.normalize('NFC').trim().toLowerCase();
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(norm));
  return 's'+[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,24)+'@gmail.com';
}

let deferredPrompt=null,pushState='unknown'; // unknown | unsupported | needInstall | off | denied | on
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let swReg=null;
function registerSW(){
  if(!('serviceWorker' in navigator)||location.protocol==='file:')return;
  navigator.serviceWorker.register('sw.js').then(r=>{swReg=r;checkPush()}).catch(e=>console.warn('SW failed',e));
}

function b64ToU8(b){const p='='.repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
async function checkPush(){
  if(!me||me.admin){pushState='unknown';return refreshPwa()}
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){
    pushState=(isIOS&&!isStandalone())?'needInstall':'unsupported';return refreshPwa()}
  if(Notification.permission==='denied'){pushState='denied';return refreshPwa()}
  try{
    const reg=swReg||await navigator.serviceWorker.getRegistration();
    const sub=reg&&await reg.pushManager.getSubscription();
    if(sub&&Notification.permission==='granted'){pushState='on';sb.rpc('save_push',{p_endpoint:sub.endpoint,p_p256dh:btoa(String.fromCharCode(...new Uint8Array(sub.getKey('p256dh')))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),p_auth:btoa(String.fromCharCode(...new Uint8Array(sub.getKey('auth')))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}).then(()=>{},()=>{})}
    else pushState='off';
  }catch(e){pushState='off'}
  refreshPwa();
}
async function enablePush(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){pushState=perm==='denied'?'denied':'off';return refreshPwa()}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUBLIC)});
    const j=sub.toJSON();
    const {error}=await sb.rpc('save_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
    if(error)throw error;
    pushState='on';refreshPwa();
  }catch(e){alert('تعذر تفعيل الإشعارات: '+errMsg(e));checkPush()}
}
async function disablePush(){
  try{
    const reg=swReg||await navigator.serviceWorker.getRegistration();
    const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){await sb.rpc('remove_push',{p_endpoint:sub.endpoint});await sub.unsubscribe()}
  }catch(e){}
  pushState='off';refreshPwa();
}

  try{const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();

let ytTimers=[];const pend={};
const ST={done:'✅ شاهدته',part:'▶️ بدأت',none:'⏳ لم تشاهد'};
function actOf(id){return act[id]=act[id]||{opens:0,activeSec:0,lastSeen:0,days:{}}}
function pr(uid,id){prog[uid]=prog[uid]||{};return prog[uid][id]=prog[uid][id]||{sec:0,done:false,manual:false,first:0,last:0}}
function addSec(id,sec){if(!me||me.admin)return;const p=pr(me.id,id);if(!p.first)p.first=Date.now();p.sec+=sec;p.last=Date.now();const q=pend[id]=pend[id]||{sec:0,done:false,manual:false};q.sec+=sec}
function markDone(id,manual){if(!me||me.admin)return;const p=pr(me.id,id);if(!p.first)p.first=Date.now();p.done=true;if(manual)p.manual=true;p.last=Date.now();
  const q=pend[id]=pend[id]||{sec:0,done:false,manual:false};q.done=true;if(manual)q.manual=true;flushProg();updBadge(id)}
function markDoneOnce(id){if(me&&!me.admin&&!pr(me.id,id).done)markDone(id)}
async function flushProg(){
  if(!sb)return;
  for(const id of Object.keys(pend)){const q=pend[id];delete pend[id];
    const {error}=await sb.rpc('track_progress',{p_content:id,p_sec:Math.round(q.sec),p_done:q.done,p_manual:q.manual});
    if(error){const n=pend[id]=pend[id]||{sec:0,done:false,manual:false};n.sec+=q.sec;n.done=n.done||q.done;n.manual=n.manual||q.manual}}
}
function stOf(uid,id){const p=prog[uid]&&prog[uid][id];if(!p)return 'none';if(p.done)return 'done';return p.first?'part':'none'}

  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);

    const m=v.mime||'';
    if(m.startsWith('video/'))return `<video data-fk="${esc(v.fileKey)}" data-item="${v.id}"${tk} controls playsinline preload="metadata"></video>`;
    if(m.startsWith('image/'))return `<img data-fk="${esc(v.fileKey)}" data-item="${v.id}"${tk} style="width:100%;height:100%;object-fit:contain;cursor:zoom-in" onclick="imgClick(this,'${v.id}',${track?1:0})">`;
    return `<div class="filebox"><div style="font-size:34px">📄</div><div style="margin:6px 0;word-break:break-all">${esc(v.fname||'ملف')}</div><a class="btn sm" data-fk="${esc(v.fileKey)}" data-item="${v.id}" target="_blank" rel="noopener" onclick="fileClick('${v.id}',${track?1:0})">⬇️ فتح / تحميل</a></div>`;
  }
  const y=ytId(v.url||'');
  if(y){const o=location.protocol.startsWith('http')?'&origin='+encodeURIComponent(location.origin):'';
    return `<iframe id="yt_${v.id}" data-yt="1" data-item="${v.id}"${tk} src="https://www.youtube.com/embed/${y}?enablejsapi=1${o}" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe>`}
  return `<video src="${esc(v.url||'')}" data-item="${v.id}"${tk} controls playsinline></video>`;
}
function imgClick(el,id,t){if(t)markDone(id);showModal(`<img src="${el.src}" style="width:100%;border-radius:10px"><button class="btn ghost" style="margin-top:10px" onclick="closeModal()">إغلاق</button>`)}
function fileClick(id,t){if(t)markDone(id)}
function progSummary(u,list){const d=list.filter(v=>stOf(u.id,v.id)==='done').length,t=list.length;if(!t)return '';const pc=Math.round(d/t*100);
  return `<div class="card"><b>تقدمك: ${d} من ${t}</b> (${pc}%)<div class="bar"><i style="width:${pc}%"></i></div></div>`}
function vidCards(list,track){
  if(!list.length)return '<div class="empty">لسه مفيش محتوى هنا 📭</div>';
  return `<div class="grid">${list.map(v=>{const st=track&&me&&!me.admin?stOf(me.id,v.id):null;
    return `<div class="vid"><div class="v">${media(v,track)}</div><div class="t">${esc(v.title)}<div><span class="tag">${GRA[v.grade]}</span><span class="tag">${GPA[v.group]}</span>${v.created&&Date.now()-v.created<3*864e5?'<span class="tag st-new">🆕 جديد</span>':''}${st?`<span class="tag st-${st}" id="st_${v.id}">${ST[st]}</span>`:''}</div>
    ${st&&st!=='done'?`<button class="btn ghost sm" style="margin-top:8px" onclick="markDone('${v.id}',true);render()">✔️ خلّصت المشاهدة</button>`:''}</div></div>`}).join('')}</div>`;
}
function trackVideo(el){
  const id=el.dataset.item;let last=0;
  el.addEventListener('play',()=>{last=el.currentTime});
  el.addEventListener('seeked',()=>{last=el.currentTime});
  el.addEventListener('timeupdate',()=>{const t=el.currentTime,d=t-last;if(d>0&&d<1.5&&!el.paused)addSec(id,d);last=t;if(el.duration&&t/el.duration>=.9)markDoneOnce(id)});
  el.addEventListener('ended',()=>markDoneOnce(id));
}
function loadYT(cb){
  if(window.YT&&YT.Player)return cb();
  (window._ytq=window._ytq||[]).push(cb);
  if(!window._ytl){window._ytl=1;const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc);
    window.onYouTubeIframeAPIReady=()=>{(window._ytq||[]).forEach(f=>f());window._ytq=[]}}
}
function initYT(){
  document.querySelectorAll('iframe[data-yt][data-track]').forEach(fr=>{
    const id=fr.dataset.item;let timer=null;
    const pl=new YT.Player(fr.id,{events:{onStateChange:e=>{
      if(e.data===1){if(!timer){timer=setInterval(()=>{addSec(id,1);try{const d=pl.getDuration();if(d&&pl.getCurrentTime()/d>=.9)markDoneOnce(id)}catch(_){}},1000);ytTimers.push(timer)}}
      else{clearInterval(timer);timer=null;if(e.data===0)markDoneOnce(id)}}}});
  });
}
function hydrate(){
  ytTimers.forEach(clearInterval);ytTimers=[];
  if(!sb)return;
  document.querySelectorAll('[data-fk]').forEach(async el=>{
    try{const url=await signed(el.dataset.fk);
      if(!url){const par=el.parentElement;if(par)par.innerHTML='<div class="filebox">⚠️ الملف غير متاح</div>';return}
      if(el.tagName==='A')el.href=url;else el.src=url;
      if(el.tagName==='VIDEO'&&el.dataset.track)trackVideo(el);
    }catch(e){}
  });
  document.querySelectorAll('video[data-track]:not([data-fk])').forEach(trackVideo);
  if(document.querySelector('iframe[data-yt][data-track]'))loadYT(initYT);
}
function render(){renderInner();hydrate();applyTilt()}
function renderInner(){
  const app=$('app');
  if(!CONFIGURED){app.innerHTML=setupView();return}
  if(!ready){app.innerHTML='<div class="empty">⏳ جاري التحميل...</div>';return}

}

async function upImg(inp,kind){

  try{
    msg('جاري الرفع...');

      const url=await putPublic(`${me.id}/banner.gif`,f,'image/gif');

}

function exportCSV(){
  const T=s=>'‎'+s; // يمنع Excel من إسقاط الصفر في أول الرقم
  const rows=[['الاسم','رقم الطالب','رقم ولي الأمر','المرحلة','المجموعة','الحالة','تاريخ التسجيل']].concat(filtered().map(u=>[u.name,u.phone?'="'+u.phone+'"':'',u.parentPhone?'="'+u.parentPhone+'"':'',GR[u.grade],GP[u.group],u.blocked?'موقوف':'نشط',u.created]));
  const csv='﻿'+rows.map(r=>r.map((c,i)=>(i===1||i===2)&&String(c).startsWith('=')?String(c):'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');

async function addVideo(){
  let t=$('vt').value.trim();const u=$('vu').value.trim(),f=$('vf').files[0];
  if(!f&&!u)return alert('اكتب رابط أو اختار ملف');
  if(!f&&!/^https?:\/\//i.test(u))return alert('الرابط لازم يبدأ بـ http أو https');
  if(f&&f.size>MAX_FILE)return alert('الملف أكبر من 50MB، استخدم رابط يوتيوب Unlisted بدلاً منه');
  if(!t)t=f?f.name:'بدون عنوان';
  const row={title:t,grade:$('vg').value,grp:$('vgp').value};
  const btn=$('addbtn');btn.disabled=true;let path=null;
  try{
    if(f){
      $('upmsg2').textContent='جاري رفع الملف...';
      const ext=(f.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,8)||'bin';
      path=`${crypto.randomUUID()}/${crypto.randomUUID().slice(0,8)}.${ext}`;
      const {error}=await sb.storage.from('content').upload(path,f,{contentType:f.type||'application/octet-stream'});if(error)throw error;
      Object.assign(row,{kind:'file',file_path:path,mime:f.type||'application/octet-stream',fname:f.name,size:f.size});
    }else Object.assign(row,{kind:'link',url:u});
    const wantNotify=$('vnotify')&&$('vnotify').checked;
    const {data:ins,error}=await sb.from('content').insert(row).select('id').single();if(error)throw error;
    await Promise.all([loadContent(),loadAdminData()]);render();
    if(wantNotify&&ins){
      try{const r=await callAdmin({action:'notify',id:ins.id});
        alert(r.devices?`تم الرفع ✅\nوصل الإشعار لـ ${r.sent} جهاز${r.failed?' (فشل '+r.failed+')':''}\n(${r.students} طالب في المجموعة، ${r.devices} جهاز مفعّل الإشعارات)`:`تم الرفع ✅\nمفيش طالب مفعّل الإشعارات لسه من ${r.students} طالب في المجموعة.`)}
      catch(e){alert('تم الرفع ✅ لكن الإشعار ما اتبعتش: '+errMsg(e))}
    }
  }catch(e){
    if(path)sb.storage.from('content').remove([path]);
    btn.disabled=false;$('upmsg2').textContent='';alert('حصلت مشكلة: '+errMsg(e));
  }
}

async function saveVideo(id){
  const v=videos.find(x=>x.id===id),t=$('et').value.trim();if(!t)return alert('اكتب العنوان');
  const patch={title:t,grade:$('eg').value,grp:$('egp').value};
  if(v.kind!=='file'){const u=$('eu').value.trim();if(!/^https?:\/\//i.test(u))return alert('الرابط لازم يبدأ بـ http أو https');patch.url=u}
  const {error}=await sb.from('content').update(patch).eq('id',id);if(error)return alert(errMsg(error));
  closeModal();await loadContent();render();
}
async function delVideo(id){
  if(!confirm('حذف نهائياً؟'))return;
  const v=videos.find(x=>x.id===id);
  const {error}=await sb.from('content').delete().eq('id',id);if(error)return alert(errMsg(error));
  if(v&&v.fileKey)sb.storage.from('content').remove([v.fileKey]);
  await Promise.all([loadContent(),loadAdminData()]);render();
}

/* --- student tracking --- */
let trG='all',trR='all',trQ='',tf='all';
const itemsOf=u=>videos.filter(v=>forMe(v,u));
function ago(ts){if(!ts)return 'لم يدخل';const sec=(Date.now()-ts)/1000;if(sec<300)return '🟢 الآن';if(sec<3600)return 'من '+Math.floor(sec/60)+' دقيقة';if(sec<86400)return 'من '+Math.floor(sec/3600)+' ساعة';return 'من '+Math.floor(sec/86400)+' يوم'}
function fmtDur(sec){sec=Math.round(sec);if(sec<60)return sec+' ث';const m=Math.floor(sec/60);if(m<60)return m+' د';return Math.floor(m/60)+' س '+(m%60)+' د'}
function days7(id){const a=actOf(id);let n=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);if(a.days[dayKey(d)]!==undefined)n++}return n}
function trackStats(u){const a=actOf(u.id),it=itemsOf(u);return {a,it,done:it.filter(v=>stOf(u.id,v.id)==='done').length,part:it.filter(v=>stOf(u.id,v.id)==='part').length,d7:days7(u.id)}}
function trFiltered(){return users.filter(u=>{
  if(trG!=='all'&&u.group!==trG)return false;if(trR!=='all'&&u.grade!==trR)return false;
  if(trQ&&!u.name.toLowerCase().includes(trQ.trim().toLowerCase()))return false;
  const st=trackStats(u);
  if(tf==='inactive')return !st.a.lastSeen||Date.now()-st.a.lastSeen>3*86400000;
  if(tf==='nowatch')return st.it.length>0&&st.done+st.part===0;
  if(tf==='finished')return st.it.length>0&&st.done===st.it.length;
  return true})}
function trackView(){
  const all=users.map(trackStats),today=users.filter(u=>actOf(u.id).days[dayKey()]!==undefined).length;
  const inactive=all.filter(x=>!x.a.lastSeen||Date.now()-x.a.lastSeen>3*86400000).length;
  const withIt=all.filter(x=>x.it.length>0),avg=withIt.length?Math.round(withIt.reduce((t,x)=>t+x.done/x.it.length,0)/withIt.length*100):0;
  const stat=(n,l)=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`;
  return `<h3 style="margin-bottom:12px">📈 متابعة حالات الطلاب</h3>
  <div class="stats">${stat(today,'دخلوا النهارده')}${stat(inactive,'غايبين +3 أيام')}${stat(avg+'%','متوسط إنجاز الفيديوهات')}</div>
  <div class="card"><div class="row"><input placeholder="🔍 ابحث بالاسم" value="${esc(trQ)}" oninput="trQ=this.value;trTable()">
  <select onchange="trG=this.value;trTable()">${opts(GP,trG,'كل المجموعات')}</select>
  <select onchange="tf=this.value;trTable()"><option value="all" ${tf==='all'?'selected':''}>كل الحالات</option><option value="inactive" ${tf==='inactive'?'selected':''}>غايبين +3 أيام</option><option value="nowatch" ${tf==='nowatch'?'selected':''}>ما شافوش أي فيديو</option><option value="finished" ${tf==='finished'?'selected':''}>خلّصوا كل الفيديوهات</option></select></div></div>
  <div class="card scroll" id="trtbl">${trTableHTML()}</div>`;
}
function trTable(){$('trtbl').innerHTML=trTableHTML()}
function trTableHTML(){
  const list=trFiltered();
  return `<div style="margin-bottom:8px;color:var(--mut)">العدد: ${list.length}</div><table>
  <tr><th>الطالب</th><th>المرحلة / المجموعة</th><th>الفيديوهات</th><th>آخر ظهور</th><th>مرات الفتح</th><th>أيام نشطة (7)</th><th>وقت المذاكرة</th><th></th></tr>
  ${list.map(u=>{const st=trackStats(u),pc=st.it.length?Math.round(st.done/st.it.length*100):0;
    return `<tr><td><div class="rowi">${miniAv(u)}<span>${esc(u.name)}</span></div></td><td>${GR[u.grade]}<br><small style="color:var(--mut)">${GP[u.group]}</small></td>
    <td style="min-width:120px">${st.it.length?`${st.done}/${st.it.length} (${pc}%)<div class="bar"><i style="width:${pc}%"></i></div>`:'<small style="color:var(--mut)">مفيش محتوى</small>'}</td>
    <td>${ago(st.a.lastSeen)}</td><td>${st.a.opens}</td><td>${st.d7}/7</td><td>${fmtDur(st.a.activeSec)}</td>
    <td style="white-space:nowrap"><button class="btn ghost sm" onclick="trackDetail('${u.id}')">تفاصيل</button>${u.parentPhone?` <a class="pl" href="tel:${esc(u.parentPhone)}" title="اتصال بولي الأمر">📞</a><a class="pl" href="https://wa.me/2${esc(u.parentPhone.slice(1))}" target="_blank" rel="noopener" title="واتساب ولي الأمر">💬</a>`:''}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">لا يوجد طلاب</td></tr>'}</table>`;
}
function trackDetail(id){
  const u=users.find(x=>x.id===id),{a,it,done,d7}=trackStats(u);
  const rows=it.map(v=>{const p=prog[u.id]&&prog[u.id][v.id],st=stOf(u.id,v.id);
    return `<div class="rowi" style="border-bottom:1px solid #1d4036"><div style="flex:1"><b>${esc(v.title)}</b><div style="font-size:12px;color:var(--mut)">${st==='none'?'لم يفتحه':'وقت المشاهدة: '+fmtDur(p.sec)+(p.manual?' (تأكيد يدوي)':'')+' • آخر مرة '+ago(p.last)}</div></div><span class="tag st-${st}">${st==='done'?'✅ شاهده':st==='part'?'▶️ بدأ ولم يكمل':'❌ لم يشاهد'}</span></div>`}).join('')||'<div class="empty">مفيش محتوى لمجموعته لسه</div>';
  let bars='';for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const sec=a.days[dayKey(d)];
    bars+=`<div class="dcol"><div class="dbar" title="${sec===undefined?'لم يدخل':fmtDur(sec)}" style="height:${sec===undefined?4:Math.min(60,6+Math.round(sec/60)*2)}px;background:${sec===undefined?'#1d4036':'var(--ac)'}"></div><small>${d.getDate()}/${d.getMonth()+1}</small></div>`}
  showModal(`<div class="rowi">${miniAv(u)}<div><b>${esc(u.name)}</b><div style="font-size:12px;color:var(--mut)">${GR[u.grade]} • ${GP[u.group]}</div></div></div>
  <div style="font-size:13px;margin:8px 0;line-height:2">📱 الطالب: ${phoneLinks(u.phone)}<br>👨‍👩‍👦 ولي الأمر: ${phoneLinks(u.parentPhone)}</div>
  <div class="stats" style="margin-top:10px"><div class="stat"><b>${done}/${it.length}</b><span>فيديوهات مكتملة</span></div><div class="stat"><b>${a.opens}</b><span>مرات فتح المنصة</span></div><div class="stat"><b>${fmtDur(a.activeSec)}</b><span>إجمالي وقت المذاكرة</span></div></div>
  <div style="font-size:13px;color:var(--mut);margin-bottom:6px">آخر ظهور: ${ago(a.lastSeen)} • أيام نشطة هذا الأسبوع: ${d7}/7</div>
  <div class="dcols">${bars}</div>
  <h4 style="margin:12px 0 6px;color:var(--mut)">حالة كل فيديو</h4>${rows}
  <button class="btn ghost" style="margin-top:12px" onclick="closeModal()">إغلاق</button>`);
}

/* ---------- 3D / 4D effects ---------- */
function buildBg(){
  const bg=$('bg3d');if(!bg||document.body.classList.contains('lite'))return;
  let h='<div class="orb o1"></div><div class="orb o2"></div><div class="hwrap"><div class="helix">';
  for(let i=0;i<26;i++){const y=(i-13)*30,a=i*24;
    h+=`<div class="rung" style="transform:translateY(${y}px) rotateY(${a}deg)"><i class="sa" style="--a:${a}deg"><u></u></i><b></b><i class="sb" style="--a:${a}deg"><u></u></i></div>`}
  bg.innerHTML=h+'</div></div>';
  addEventListener('scroll',()=>{bg.style.setProperty('--sy',(scrollY*.06)+'px')},{passive:true});
}
function applyTilt(){
  if(document.body.classList.contains('lite'))return;
  document.querySelectorAll('.vid,.stat').forEach(el=>{
    if(el._tilt)return;el._tilt=1;
    el.addEventListener('pointermove',e=>{
      if(e.pointerType!=='mouse')return;
      const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      el.style.transform=`perspective(900px) rotateX(${(-y*8).toFixed(2)}deg) rotateY(${(x*10).toFixed(2)}deg) translateZ(8px)`;
      el.style.setProperty('--gx',((x+.5)*100).toFixed(0)+'%');el.style.setProperty('--gy',((y+.5)*100).toFixed(0)+'%');
    });
    el.addEventListener('pointerleave',()=>{el.style.transform=''});
  });
}
/* مقدمة Three.js: نص ذهبي مجسم + DNA + جسيمات (لو فشلت بيفضل النص الـ CSS) */
async function initIntro3D(){
  if(document.body.classList.contains('lite')){introResolve('fallback');return}
  introTimer=setTimeout(()=>introResolve('fallback'),5000);   // لو المجسم اتأخر أكتر من 5 ثواني نعرض النص الاحتياطي
  try{
    const THREE=await import('three');
    const {RoomEnvironment}=await import('three/addons/environments/RoomEnvironment.js');
    const {FontLoader}=await import('three/addons/loaders/FontLoader.js');
    const {TextGeometry}=await import('three/addons/geometries/TextGeometry.js');
    if(introClosed||introState!=='loading')return;
    const font=await new Promise((res,rej)=>new FontLoader().load('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',res,undefined,rej));
    if(introClosed||introState!=='loading')return;
    const host=$('intro'),canvas=document.createElement('canvas');canvas.id='i3d';host.insertBefore(canvas,host.firstChild);
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
    renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.outputColorSpace=THREE.SRGBColorSpace;
    const scene=new THREE.Scene();
    scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
    const cam=new THREE.PerspectiveCamera(38,1,.1,100);cam.position.set(0,0,16);
    const key=new THREE.DirectionalLight(0xfff1cf,2.4);key.position.set(5,6,9);scene.add(key);
    const rim=new THREE.DirectionalLight(0x22d3ee,1.6);rim.position.set(-7,1,4);scene.add(rim);

    const mk=(txt,size,mat)=>{const g=new TextGeometry(txt,{font,size,height:size*.38,curveSegments:10,bevelEnabled:true,bevelThickness:size*.045,bevelSize:size*.03,bevelSegments:6});
      g.center();g.computeBoundingBox();return new THREE.Mesh(g,mat)};
    const gold=new THREE.MeshPhysicalMaterial({color:0xe2b44a,metalness:1,roughness:.2,clearcoat:.5,clearcoatRoughness:.15,envMapIntensity:1.5});
    const emer=new THREE.MeshPhysicalMaterial({color:0x14d68a,metalness:.35,roughness:.1,clearcoat:1,clearcoatRoughness:.05,envMapIntensity:1.7});
    const t1=mk('Miss Amal',1.5,gold),t2=mk('Biology',1.05,emer);t1.position.y=.95;t2.position.y=-.85;
    const title=new THREE.Group();title.add(t1,t2);scene.add(title);
    const w1=t1.geometry.boundingBox.max.x-t1.geometry.boundingBox.min.x;

    // DNA helix
    const helix=new THREE.Group(),N=34,R=1.7,sg=new THREE.SphereGeometry(.17,28,28),rg=new THREE.CylinderGeometry(.04,.04,2*R,10);
    const mA=new THREE.MeshPhysicalMaterial({color:0x22d3ee,metalness:.1,roughness:.12,clearcoat:1,envMapIntensity:1.5,emissive:0x0a4a5a,emissiveIntensity:.7});
    const mB=new THREE.MeshPhysicalMaterial({color:0xf5d98b,metalness:.9,roughness:.2,clearcoat:.6,envMapIntensity:1.4});
    const mR=new THREE.MeshStandardMaterial({color:0x9fe8c8,metalness:.5,roughness:.35,transparent:true,opacity:.5});
    for(let i=0;i<N;i++){
      const g=new THREE.Group();g.position.y=(i-N/2)*.33;g.rotation.y=-i*.42;
      const a=new THREE.Mesh(sg,mA);a.position.x=R;const b=new THREE.Mesh(sg,mB);b.position.x=-R;
      const r=new THREE.Mesh(rg,mR);r.rotation.z=Math.PI/2;g.add(a,b,r);helix.add(g);
    }
    helix.position.z=-4;helix.rotation.z=.32;scene.add(helix);

    // particles
    const pc=300,pp=new Float32Array(pc*3);for(let i=0;i<pc*3;i++)pp[i]=(Math.random()-.5)*(i%3===2?10:22);
    const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
    const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.06,color:0xbffcdc,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false}));
    scene.add(pts);

    let base=1,px=0,py=0,tx=0,ty=0;
    const resize=()=>{const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
      const vw=2*Math.tan(cam.fov*Math.PI/360)*cam.position.z*cam.aspect;base=Math.min(1.15,vw*.86/w1)};
    resize();addEventListener('resize',resize);
    const onPtr=e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2};
    const onGyro=e=>{if(e.gamma==null)return;tx=Math.max(-1,Math.min(1,e.gamma/30));ty=Math.max(-1,Math.min(1,(e.beta-45)/30))};
    addEventListener('pointermove',onPtr);addEventListener('deviceorientation',onGyro);

    const clock=new THREE.Clock();let raf=0,shown=false;
    const loop=()=>{
      raf=requestAnimationFrame(loop);const t=clock.getElapsedTime(),k=1-Math.exp(-t*2.2);
      px+=(tx-px)*.06;py+=(ty-py)*.06;
      title.scale.setScalar(base*(.5+.5*k));
      title.rotation.y=Math.sin(t*.7)*.3+px*.35+(1-k)*1.4;
      title.rotation.x=-.06+py*.18+Math.sin(t*.5)*.04;
      title.position.y=Math.sin(t*1.1)*.12;
      helix.rotation.y=t*.45;pts.rotation.y=t*.02;pts.rotation.x=Math.sin(t*.1)*.05;
      cam.position.x=px*.5;cam.position.y=-py*.3;cam.lookAt(0,0,0);
      renderer.render(scene,cam);
      if(!shown){shown=true;introResolve('ready')}
    };
    loop();
    window._i3d={stop(){cancelAnimationFrame(raf);removeEventListener('resize',resize);removeEventListener('pointermove',onPtr);removeEventListener('deviceorientation',onGyro);try{renderer.dispose();canvas.remove()}catch(_){}}};
  }catch(e){console.warn('3D intro unavailable, using CSS fallback',e);introResolve('fallback')}
}

buildBg();initIntro3D();
registerSW();

if(CONFIGURED){
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&me){me=null;prof=null;stopTimers();render()}});
  boot();
}else{ready=true}

</script>
</body>
</html>
