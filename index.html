<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miss Amal Biology</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b1f1a;--card:#12312a;--card2:#184238;--ac:#4ade80;--ac2:#22d3ee;--tx:#ecfdf5;--mut:#9fc9bb;--danger:#f87171}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0}
input,select{font-family:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid #2c5d4f;background:#0e2923;color:var(--tx);font-size:15px;margin-bottom:12px}
input:focus,select:focus{outline:2px solid var(--ac)}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06261c;font-weight:800;padding:12px 20px;border-radius:12px;font-size:15px;width:100%}
.btn.sm{width:auto;padding:8px 14px;font-size:13px}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid #2c5d4f}
.btn.red{background:var(--danger);color:#fff}
/* intro */
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#14473a,#04100c 70%);z-index:100;perspective:900px;overflow:hidden;transition:opacity .8s}
#intro.hide{opacity:0;pointer-events:none}
.logo3d{font-family:'Poppins',sans-serif;font-weight:800;font-size:clamp(34px,11vw,110px);text-align:center;line-height:1.1;color:#b6ffd3;transform-style:preserve-3d;animation:sway 5s ease-in-out infinite alternate;direction:ltr}
.logo3d small{display:block;font-size:.55em;color:#67e8f9}
@keyframes sway{from{transform:rotateX(18deg) rotateY(-28deg)}to{transform:rotateX(8deg) rotateY(28deg)}}
.dna{position:absolute;font-size:30px;opacity:.25;animation:float 7s linear infinite}
@keyframes float{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-10vh) rotate(360deg)}}
.enter{margin-top:60px;width:auto;padding:14px 38px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
/* auth */
.wrap{max-width:430px;margin:0 auto;padding:24px 18px}
.box{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 10px 40px #0008}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border-radius:12px;background:#0e2923;color:var(--mut);font-weight:700}
.tabs button.on{background:var(--ac);color:#06261c}
.title{text-align:center;font-family:'Poppins';font-size:26px;margin:10px 0 20px;direction:ltr;color:var(--ac)}
.err{color:var(--danger);font-size:14px;margin-bottom:10px;min-height:18px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
/* app layout */
.layout{display:flex;min-height:100vh}
.side{width:250px;background:#0a1915;padding:16px;border-left:1px solid #1d4036;flex-shrink:0}
.side h4{color:var(--mut);font-size:12px;margin:18px 0 6px}
.side a{display:block;padding:10px 12px;border-radius:10px;color:var(--tx);cursor:pointer;margin-bottom:4px;font-size:14px}
.side a:hover{background:var(--card)}
.side a.on{background:var(--card2);color:var(--ac);font-weight:700}
.main{flex:1;padding:18px;min-width:0}
.menuBtn{display:none}
@media(max-width:760px){
 .layout{flex-direction:column}.side{width:100%;display:none;border:0}.side.open{display:block}
 .menuBtn{display:block;width:100%;margin-bottom:10px;background:var(--card);color:var(--tx);padding:10px;border-radius:10px}
}
.banner{height:170px;border-radius:18px;background-size:cover;background-position:center;position:relative;margin-bottom:82px}
.avatar{position:absolute;bottom:-48px;right:22px;width:100px;height:100px;border-radius:50%;border:4px solid var(--bg);background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:52px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.pname{position:absolute;top:calc(100% + 10px);right:136px;font-weight:800;font-size:20px}
.pname span{display:block;font-size:13px;color:var(--mut);font-weight:400}
.b1{background:linear-gradient(120deg,#16a34a,#0891b2,#7c3aed,#16a34a);background-size:300% 300%;animation:bg 8s ease infinite}
.b2{background:linear-gradient(120deg,#f59e0b,#ef4444,#ec4899,#f59e0b);background-size:300% 300%;animation:bg 6s ease infinite}
.b3{background:linear-gradient(120deg,#0ea5e9,#1e3a8a,#06b6d4,#0ea5e9);background-size:300% 300%;animation:bg 7s ease infinite}
.b4{background:repeating-linear-gradient(60deg,#065f46 0 20px,#047857 20px 40px);background-size:200% 200%;animation:bg 4s linear infinite}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.vid{background:var(--card);border-radius:16px;overflow:hidden}
.vid .v{aspect-ratio:16/9;background:#000}
.vid iframe,.vid video{width:100%;height:100%;border:0}
.vid .t{padding:12px;font-weight:600;font-size:14px}
.tag{display:inline-block;background:var(--card2);color:var(--ac);padding:2px 10px;border-radius:99px;font-size:12px;margin:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid #1d4036}
th{color:var(--mut)}
.scroll{overflow-x:auto}
.avs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.avs span{width:46px;height:46px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;border:2px solid transparent}
.avs span.on{border-color:var(--ac)}
.bns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bns div{width:80px;height:44px;border-radius:10px;cursor:pointer;border:2px solid transparent}
.bns div.on{border-color:#fff}
.empty{text-align:center;color:var(--mut);padding:40px 0}

.mback{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.mbox{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border-radius:16px;padding:16px;text-align:center}
.stat b{display:block;font-size:30px;color:var(--ac)}.stat span{font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.row>input,.row>select{flex:1;min-width:130px;margin-bottom:0}
.rowi{display:flex;align-items:center;gap:10px;padding:6px 0}
.mini{width:34px;height:34px;border-radius:50%;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.mini img{width:100%;height:100%;object-fit:cover}
.avatar{overflow:hidden}

.bar{height:8px;background:#0e2923;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.st-done{background:#14532d;color:#86efac}.st-part{background:#713f12;color:#fde68a}.st-none{background:#2a3a35;color:var(--mut)}
.filebox{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:13px;color:var(--tx);background:#0e2923}
.dcols{display:flex;gap:6px;align-items:flex-end;height:90px;margin-bottom:6px}.dcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}.dbar{width:70%;border-radius:6px 6px 0 0}.dcol small{font-size:10px;color:var(--mut)}
.vid img{display:block}
.tcard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 14px;margin-bottom:14px;border:1px solid #1d4036}
.mini.big{width:52px;height:52px;font-size:28px}
</style>
</head>
<body>

<div id="intro">
  <div id="dnas"></div>
  <div class="logo3d" id="logo3d">Miss Amal<small>Biology</small></div>
  <button class="btn enter" onclick="closeIntro()">ادخل المنصة</button>
</div>

<div id="app"></div>
<div id="mroot"></div>

<script>
const GR={1:'أولى ثانوي',2:'تانية ثانوي',3:'تالتة ثانوي'};
const GP={sat:'مجموعة السبت',tue:'مجموعة التلات',thu:'مجموعة الخميس'};
const AVS=['🧬','🔬','🧪','🦋','🌿','🧫','🐬','🦉','🌸','🧠','🫀','🦠'];
const BNS=['b1','b2','b3','b4'];

/* ---------- storage ---------- */
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('المساحة المخزنة امتلت، جرب صورة أصغر');return false}};
let admin=load('mab_admin',{name:'admin',pass:'admin123',avatar:'👩‍🏫',avatarImg:''});
let act=load('mab_act',{}), prog=load('mab_prog',{});
let users=load('mab_users',[]), videos=load('mab_videos',[]), me=load('mab_session',null);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- intro 3D ---------- */
(function(){
  let sh=[];for(let i=1;i<=22;i++)sh.push(`${i*0.7}px ${i*0.7}px 0 hsl(${160-i*2},70%,${45-i}%)`);
  sh.push('18px 28px 40px rgba(0,0,0,.6)');
  document.getElementById('logo3d').style.textShadow=sh.join(',');
  const d=document.getElementById('dnas');
  for(let i=0;i<14;i++){const e=document.createElement('div');e.className='dna';e.textContent=['🧬','🔬','🌿','🦠'][i%4];
    e.style.left=Math.random()*100+'%';e.style.animationDelay=(-Math.random()*7)+'s';e.style.animationDuration=(6+Math.random()*6)+'s';d.appendChild(e)}
  setTimeout(()=>closeIntro(),6000);
})();
let introClosed=false;
function closeIntro(){if(introClosed)return;introClosed=true;const i=document.getElementById('intro');i.classList.add('hide');setTimeout(()=>i.remove(),900);render()}

/* ---------- auth ---------- */
let authTab='login';
function authView(err=''){
  const reg=authTab==='reg';
  return `<div class="wrap"><div class="title">Miss Amal Biology</div><div class="box">
  <div class="tabs"><button class="${!reg?'on':''}" onclick="authTab='login';render()">تسجيل دخول</button><button class="${reg?'on':''}" onclick="authTab='reg';render()">حساب جديد</button></div>
  <div class="err">${err}</div>
  <label>الاسم</label><input id="fn" placeholder="اكتب اسمك">
  <label>الباسورد</label><input id="fp" type="password" placeholder="الباسورد">
  ${reg?`<label>المرحلة</label><select id="fg"><option value="">اختار المرحلة</option>${Object.entries(GR).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
  <label>المجموعة</label><select id="fgp"><option value="">اختار المجموعة</option>${Object.entries(GP).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>`:''}
  <button class="btn" onclick="${reg?'doReg()':'doLogin()'}">${reg?'سجّل':'ادخل'}</button>
  </div></div>`;
}
function doReg(){
  const n=fn.value.trim(),p=fp.value,g=fg.value,gp=fgp.value;
  if(!n||!p||!g||!gp)return authErr('كمّل كل البيانات');
  if(p.length<4)return authErr('الباسورد لازم 4 حروف أو أرقام على الأقل');
  if(n.toLowerCase()===admin.name.toLowerCase()||users.some(u=>u.name===n))return authErr('الاسم ده مستخدم قبل كده');
  const u={id:Date.now(),name:n,pass:p,grade:g,group:gp,avatar:'🧬',avatarImg:'',banner:{t:'preset',v:'b1'},created:new Date().toLocaleString('ar-EG')};
  users.push(u);save('mab_users',users);me={id:u.id};save('mab_session',me);view='home';startSession(cur());render();
}
function doLogin(){
  const n=fn.value.trim(),p=fp.value;
  if(n.toLowerCase()===admin.name.toLowerCase()&&p===admin.pass){me={admin:true};save('mab_session',me);adminTab='dash';return render()}
  const u=users.find(u=>u.name===n&&u.pass===p);
  if(!u)return authErr('الاسم أو الباسورد غلط');
  if(u.blocked)return authErr('الحساب ده موقوف، كلّم المدرس');
  me={id:u.id};save('mab_session',me);view='home';startSession(cur());render();
}
function authErr(m){document.getElementById('app').innerHTML=authView(m)}
function logout(){me=null;localStorage.removeItem('mab_session');render()}

/* ---------- app ---------- */
let view='home',adminGroup='all',adminGrade='all',menuOpen=false;
const cur=()=>users.find(u=>u.id===me.id);
function bannerStyle(b){return b.t==='img'?`style="background-image:url(${b.v})"`:''}
function bannerCls(b){return b.t==='preset'?b.v:''}
function avatarHTML(u){return u.avatarImg?`<img src="${u.avatarImg}">`:u.avatar}

/* ---------- activity & progress tracking ---------- */
let ytTimers=[];
const pad=n=>String(n).padStart(2,'0');
const dayKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function actOf(id){return act[id]=act[id]||{opens:0,activeSec:0,lastSeen:0,first:0,days:{}}}
function saveAct(){save('mab_act',act)}
function pr(uid,id){prog[uid]=prog[uid]||{};return prog[uid][id]=prog[uid][id]||{sec:0,done:false,first:0,last:0}}
let progTimer=null;
function saveProgSoon(){clearTimeout(progTimer);progTimer=setTimeout(()=>save('mab_prog',prog),2500)}
function addSec(id,sec){if(!me||me.admin)return;const p=pr(me.id,id);if(!p.first)p.first=Date.now();p.sec+=sec;p.last=Date.now();saveProgSoon()}
function markDone(id,manual){if(!me||me.admin)return;const p=pr(me.id,id);if(!p.first)p.first=Date.now();p.done=true;if(manual)p.manual=true;p.last=Date.now();save('mab_prog',prog);updBadge(id)}
function markDoneOnce(id){if(me&&!me.admin&&!pr(me.id,id).done)markDone(id)}
function stOf(uid,id){const p=prog[uid]&&prog[uid][id];if(!p)return 'none';if(p.done)return 'done';return p.first?'part':'none'}
const ST={done:'✅ شاهدته',part:'▶️ بدأت',none:'⏳ لم تشاهد'};
function updBadge(id){const el=document.getElementById('st_'+id);if(!el||!me||me.admin)return;const st=stOf(me.id,id);el.className='tag st-'+st;el.textContent=ST[st]}
function startSession(u){if(!u)return;const a=actOf(u.id);a.opens++;a.lastSeen=Date.now();if(!a.first)a.first=Date.now();a.days[dayKey()]=a.days[dayKey()]||0;saveAct()}

/* ---------- content rendering (YouTube / files) ---------- */
function ytId(url){const m=String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);return m?m[1]:null}
function media(v,track){
  const tk=track?' data-track="1"':'';
  if(v.kind==='file'){
    const m=v.mime||'';
    if(m.startsWith('video/'))return `<video data-fk="${v.fileKey}" data-item="${v.id}"${tk} controls playsinline preload="metadata"></video>`;
    if(m.startsWith('image/'))return `<img data-fk="${v.fileKey}" data-item="${v.id}"${tk} style="width:100%;height:100%;object-fit:contain;cursor:zoom-in" onclick="imgClick(this,${v.id},${track?1:0})">`;
    return `<div class="filebox"><div style="font-size:34px">📄</div><div style="margin:6px 0;word-break:break-all">${esc(v.fname||'ملف')}</div><a class="btn sm" data-fk="${v.fileKey}" data-item="${v.id}" download="${esc(v.fname||'file')}" target="_blank" onclick="fileClick(${v.id},${track?1:0})">⬇️ فتح / تحميل</a></div>`;
  }
  const y=ytId(v.url||'');
  if(y){const o=location.protocol.startsWith('http')?'&origin='+encodeURIComponent(location.origin):'';
    return `<iframe id="yt_${v.id}" data-yt="1" data-item="${v.id}"${tk} src="https://www.youtube.com/embed/${y}?enablejsapi=1${o}" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe>`}
  return `<video src="${esc(v.url||'')}" data-item="${v.id}"${tk} controls playsinline></video>`;
}
function imgClick(el,id,t){if(t)markDone(id);showModal(`<img src="${el.src}" style="width:100%;border-radius:10px"><button class="btn ghost" style="margin-top:10px" onclick="closeModal()">إغلاق</button>`)}
function fileClick(id,t){if(t)markDone(id)}
function progSummary(u,list){const d=list.filter(v=>stOf(u.id,v.id)==='done').length,t=list.length;if(!t)return '';const pc=Math.round(d/t*100);
  return `<div class="card"><b>تقدمك: ${d} من ${t}</b> (${pc}%)<div class="bar"><i style="width:${pc}%"></i></div></div>`}
function vidCards(list,track){
  if(!list.length)return '<div class="empty">لسه مفيش محتوى هنا 📭</div>';
  return `<div class="grid">${list.map(v=>{const st=track&&me&&!me.admin?stOf(me.id,v.id):null;
    return `<div class="vid"><div class="v">${media(v,track)}</div><div class="t">${esc(v.title)}<div><span class="tag">${GR[v.grade]}</span><span class="tag">${GP[v.group]}</span>${st?`<span class="tag st-${st}" id="st_${v.id}">${ST[st]}</span>`:''}</div>
    ${st&&st!=='done'?`<button class="btn ghost sm" style="margin-top:8px" onclick="markDone(${v.id},true);render()">✔️ خلّصت المشاهدة</button>`:''}</div></div>`}).join('')}</div>`;
}

/* ---------- IndexedDB للفيديوهات والملفات الكبيرة ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('mab_media',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(k,blob){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(blob,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbDel(k){try{const d=await idb();d.transaction('f','readwrite').objectStore('f').delete(k)}catch(e){}}
function trackVideo(el){
  const id=+el.dataset.item;let last=0;
  el.addEventListener('play',()=>{last=el.currentTime});
  el.addEventListener('seeked',()=>{last=el.currentTime});
  el.addEventListener('timeupdate',()=>{const t=el.currentTime,d=t-last;if(d>0&&d<1.5&&!el.paused)addSec(id,d);last=t;if(el.duration&&t/el.duration>=.9)markDoneOnce(id)});
  el.addEventListener('ended',()=>markDoneOnce(id));
}
function loadYT(cb){
  if(window.YT&&YT.Player)return cb();
  (window._ytq=window._ytq||[]).push(cb);
  if(!window._ytl){window._ytl=1;const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc);
    window.onYouTubeIframeAPIReady=()=>{(window._ytq||[]).forEach(f=>f());window._ytq=[]}}
}
function initYT(){
  document.querySelectorAll('iframe[data-yt][data-track]').forEach(fr=>{
    const id=+fr.dataset.item;let timer=null;
    const pl=new YT.Player(fr.id,{events:{onStateChange:e=>{
      if(e.data===1){if(!timer){timer=setInterval(()=>{addSec(id,1);try{const d=pl.getDuration();if(d&&pl.getCurrentTime()/d>=.9)markDoneOnce(id)}catch(_){}},1000);ytTimers.push(timer)}}
      else{clearInterval(timer);timer=null;if(e.data===0)markDoneOnce(id)}}}});
  });
}
function hydrate(){
  ytTimers.forEach(clearInterval);ytTimers=[];
  document.querySelectorAll('video[data-bv]').forEach(async el=>{
    try{const b=await idbGet(el.dataset.bv);if(b){el.src=URL.createObjectURL(b);el.play().catch(()=>{})}}catch(e){}
  });
  document.querySelectorAll('[data-fk]').forEach(async el=>{
    try{const b=await idbGet(el.dataset.fk);
      if(!b){const par=el.parentElement;if(par)par.innerHTML='<div class="filebox">⚠️ الملف غير متاح على هذا الجهاز</div>';return}
      const url=URL.createObjectURL(b);
      if(el.tagName==='A')el.href=url;else el.src=url;
      if(el.tagName==='VIDEO'&&el.dataset.track)trackVideo(el);
    }catch(e){}
  });
  document.querySelectorAll('video[data-track]:not([data-fk])').forEach(trackVideo);
  if(document.querySelector('iframe[data-yt][data-track]'))loadYT(initYT);
}
function render(){renderInner();hydrate()}
function renderInner(){
  const app=document.getElementById('app');
  if(!me){app.innerHTML=authView();return}
  if(me.admin){app.innerHTML=adminShell();return}
  const u=cur();if(!u||u.blocked){logout();return}
  app.innerHTML=studentShell(u);
}

function studentShell(u){
  const mine=videos.filter(v=>v.grade===u.grade&&v.group===u.group);
  const nav=(k,l)=>`<a class="${view===k?'on':''}" onclick="view='${k}';menuOpen=false;render()">${l}</a>`;
  let body='';
  if(view==='home'||view==='videos'){

    return;
  }

    const u=cur();
    if(kind==='banner'&&f.type==='image/gif'){ if(f.size>1.5e6)return alert('الـ GIF كبير، اختار أقل من 1.5MB'); u.banner={t:'img',v:r.result};save('mab_users',users);return render()}
    const img=new Image();img.onload=()=>{
      const max=kind==='avatar'?400:1200,s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const d=c.toDataURL('image/jpeg',.8);

}

/* --- student tracking --- */
let trG='all',trR='all',trQ='',tf='all';
const itemsOf=u=>videos.filter(v=>v.grade===u.grade&&v.group===u.group);
function ago(ts){if(!ts)return 'لم يدخل';const sec=(Date.now()-ts)/1000;if(sec<300)return '🟢 الآن';if(sec<3600)return 'من '+Math.floor(sec/60)+' دقيقة';if(sec<86400)return 'من '+Math.floor(sec/3600)+' ساعة';return 'من '+Math.floor(sec/86400)+' يوم'}
function fmtDur(sec){sec=Math.round(sec);if(sec<60)return sec+' ث';const m=Math.floor(sec/60);if(m<60)return m+' د';return Math.floor(m/60)+' س '+(m%60)+' د'}
function days7(id){const a=actOf(id);let n=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);if(a.days[dayKey(d)]!==undefined)n++}return n}
function trackStats(u){const a=actOf(u.id),it=itemsOf(u);return {a,it,done:it.filter(v=>stOf(u.id,v.id)==='done').length,part:it.filter(v=>stOf(u.id,v.id)==='part').length,d7:days7(u.id)}}
function trFiltered(){return users.filter(u=>{
  if(trG!=='all'&&u.group!==trG)return false;if(trR!=='all'&&u.grade!==trR)return false;
  if(trQ&&!u.name.toLowerCase().includes(trQ.trim().toLowerCase()))return false;
  const st=trackStats(u);
  if(tf==='inactive')return !st.a.lastSeen||Date.now()-st.a.lastSeen>3*86400000;
  if(tf==='nowatch')return st.it.length>0&&st.done+st.part===0;
  if(tf==='finished')return st.it.length>0&&st.done===st.it.length;
  return true})}
function trackView(){
  const all=users.map(trackStats),today=users.filter(u=>actOf(u.id).days[dayKey()]!==undefined).length;
  const inactive=all.filter(x=>!x.a.lastSeen||Date.now()-x.a.lastSeen>3*86400000).length;
  const withIt=all.filter(x=>x.it.length>0),avg=withIt.length?Math.round(withIt.reduce((t,x)=>t+x.done/x.it.length,0)/withIt.length*100):0;
  const stat=(n,l)=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`;
  return `<h3 style="margin-bottom:12px">📈 متابعة حالات الطلاب</h3>
  <div class="stats">${stat(today,'دخلوا النهارده')}${stat(inactive,'غايبين +3 أيام')}${stat(avg+'%','متوسط إنجاز الفيديوهات')}</div>
  <div class="card"><div class="row"><input placeholder="🔍 ابحث بالاسم" value="${esc(trQ)}" oninput="trQ=this.value;trTable()">
  <select onchange="trR=this.value;trTable()">${opts(GR,trR,'كل المراحل')}</select>
  <select onchange="trG=this.value;trTable()">${opts(GP,trG,'كل المجموعات')}</select>
  <select onchange="tf=this.value;trTable()"><option value="all" ${tf==='all'?'selected':''}>كل الحالات</option><option value="inactive" ${tf==='inactive'?'selected':''}>غايبين +3 أيام</option><option value="nowatch" ${tf==='nowatch'?'selected':''}>ما شافوش أي فيديو</option><option value="finished" ${tf==='finished'?'selected':''}>خلّصوا كل الفيديوهات</option></select></div></div>
  <div class="card scroll" id="trtbl">${trTableHTML()}</div>`;
}
function trTable(){$('trtbl').innerHTML=trTableHTML()}
function trTableHTML(){
  const list=trFiltered();
  return `<div style="margin-bottom:8px;color:var(--mut)">العدد: ${list.length}</div><table>
  <tr><th>الطالب</th><th>المرحلة / المجموعة</th><th>الفيديوهات</th><th>آخر ظهور</th><th>مرات الفتح</th><th>أيام نشطة (7)</th><th>وقت المذاكرة</th><th></th></tr>
  ${list.map(u=>{const st=trackStats(u),pc=st.it.length?Math.round(st.done/st.it.length*100):0;
    return `<tr><td><div class="rowi">${miniAv(u)}<span>${esc(u.name)}</span></div></td><td>${GR[u.grade]}<br><small style="color:var(--mut)">${GP[u.group]}</small></td>
    <td style="min-width:120px">${st.it.length?`${st.done}/${st.it.length} (${pc}%)<div class="bar"><i style="width:${pc}%"></i></div>`:'<small style="color:var(--mut)">مفيش محتوى</small>'}</td>
    <td>${ago(st.a.lastSeen)}</td><td>${st.a.opens}</td><td>${st.d7}/7</td><td>${fmtDur(st.a.activeSec)}</td>
    <td><button class="btn ghost sm" onclick="trackDetail(${u.id})">تفاصيل</button></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">لا يوجد طلاب</td></tr>'}</table>`;
}
function trackDetail(id){
  const u=users.find(x=>x.id===id),{a,it,done,d7}=trackStats(u);
  const rows=it.map(v=>{const p=prog[u.id]&&prog[u.id][v.id],st=stOf(u.id,v.id);
    return `<div class="rowi" style="border-bottom:1px solid #1d4036"><div style="flex:1"><b>${esc(v.title)}</b><div style="font-size:12px;color:var(--mut)">${st==='none'?'لم يفتحه':'وقت المشاهدة: '+fmtDur(p.sec)+(p.manual?' (تأكيد يدوي)':'')+' • آخر مرة '+ago(p.last)}</div></div><span class="tag st-${st}">${st==='done'?'✅ شاهده':st==='part'?'▶️ بدأ ولم يكمل':'❌ لم يشاهد'}</span></div>`}).join('')||'<div class="empty">مفيش محتوى لمجموعته لسه</div>';
  let bars='';for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const sec=a.days[dayKey(d)];
    bars+=`<div class="dcol"><div class="dbar" title="${sec===undefined?'لم يدخل':fmtDur(sec)}" style="height:${sec===undefined?4:Math.min(60,6+Math.round(sec/60)*2)}px;background:${sec===undefined?'#1d4036':'var(--ac)'}"></div><small>${d.getDate()}/${d.getMonth()+1}</small></div>`}
  showModal(`<div class="rowi">${miniAv(u)}<div><b>${esc(u.name)}</b><div style="font-size:12px;color:var(--mut)">${GR[u.grade]} • ${GP[u.group]}</div></div></div>
  <div class="stats" style="margin-top:10px"><div class="stat"><b>${done}/${it.length}</b><span>فيديوهات مكتملة</span></div><div class="stat"><b>${a.opens}</b><span>مرات فتح المنصة</span></div><div class="stat"><b>${fmtDur(a.activeSec)}</b><span>إجمالي وقت المذاكرة</span></div></div>
  <div style="font-size:13px;color:var(--mut);margin-bottom:6px">آخر ظهور: ${ago(a.lastSeen)} • أيام نشطة هذا الأسبوع: ${d7}/7</div>
  <div class="dcols">${bars}</div>
  <h4 style="margin:12px 0 6px;color:var(--mut)">حالة كل فيديو</h4>${rows}
  <button class="btn ghost" style="margin-top:12px" onclick="closeModal()">إغلاق</button>`);
}

/* --- admin profile --- */
function adminProfileView(){
  return `<h3 style="margin-bottom:12px">⚙️ حساب الأدمن</h3>
  <div class="card"><h4 style="margin-bottom:10px">الصورة الشخصية</h4>
  <div class="avatar" style="position:static;margin:0 0 12px;width:100px;height:100px">${aav()}</div>
  <label>📷 اختار صورة من معرض الموبايل (أو صوّر صورة جديدة)</label><input type="file" accept="image/*" onchange="upAdminAvatar(this)">
  <label>أو اختار Avatar</label><div class="avs">${AVS.concat(['👩‍🏫','👩‍🔬']).map(a=>`<span class="${!admin.avatarImg&&admin.avatar===a?'on':''}" onclick="setAdminEmoji('${a}')">${a}</span>`).join('')}</div>
  ${admin.avatarImg?'<button class="btn ghost sm" onclick="setAdminEmoji(\''+admin.avatar+'\')">شيل الصورة</button>':''}</div>
  <div class="card"><h4 style="margin-bottom:10px">الاسم</h4>
  <label>الاسم الظاهر للطلاب</label><input id="ad" value="${esc(admin.display||'Miss Amal')}">
  <label>اسم الدخول</label><input id="an" value="${esc(admin.name)}"><button class="btn sm" onclick="saveAdminName()">حفظ</button></div>
  <div class="card"><h4 style="margin-bottom:10px">🔑 تغيير كلمة المرور</h4>
  <label>الباسورد الحالي</label><input id="ap0" type="password">
  <label>الباسورد الجديد (6 على الأقل)</label><input id="ap1" type="password">
  <label>تأكيد الباسورد الجديد</label><input id="ap2" type="password">
  <button class="btn" onclick="changeAdminPass()">تغيير كلمة المرور</button></div>`;
}
function upAdminAvatar(inp){const f=inp.files[0];if(!f)return;resizeImg(f,400,d=>{admin.avatarImg=d;save('mab_admin',admin);render()})}
function setAdminEmoji(a){admin.avatar=a;admin.avatarImg='';save('mab_admin',admin);render()}
function saveAdminName(){
  const n=$('an').value.trim();if(!n)return alert('اكتب اسم');
  if(users.some(u=>u.name.toLowerCase()===n.toLowerCase()))return alert('الاسم ده مستخدم عند طالب');
  admin.name=n;admin.display=$('ad').value.trim()||'Miss Amal';save('mab_admin',admin);alert('تم الحفظ ✅');render();
}
function changeAdminPass(){
  const o=$('ap0').value,n=$('ap1').value,c=$('ap2').value;
  if(o!==admin.pass)return alert('الباسورد الحالي غلط');
  if(n.length<6)return alert('الباسورد الجديد لازم 6 على الأقل');
  if(n!==c)return alert('الباسورد الجديد وتأكيده مش متطابقين');
  admin.pass=n;save('mab_admin',admin);alert('تم تغيير كلمة المرور ✅');render();
}

/* --- student: change own password --- */
function changeMyPass(){
  const u=cur(),o=$('mp0').value,n=$('mp1').value,c=$('mp2').value;
  if(o!==u.pass)return alert('الباسورد الحالي غلط');
  if(n.length<4)return alert('الباسورد الجديد لازم 4 على الأقل');
  if(n!==c)return alert('الباسورد الجديد وتأكيده مش متطابقين');
  u.pass=n;save('mab_users',users);alert('تم تغيير كلمة المرور ✅');render();
}


setInterval(()=>{if(!me||me.admin||document.hidden)return;const a=actOf(me.id);a.activeSec+=15;a.lastSeen=Date.now();const k=dayKey();a.days[k]=(a.days[k]||0)+15;saveAct()},15000);
if(me&&!me.admin)startSession(cur());
window.addEventListener('beforeunload',()=>{try{save('mab_prog',prog)}catch(e){}});
</script>
</body>
</html>
